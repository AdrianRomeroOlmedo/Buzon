<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Operación Verdad · Cátedra Ceuta-IATEB</title>
  <meta name="description" content="Escape room educativo de la Cátedra Ceuta-IATEB para aprender a detectar y verificar la desinformación.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <!-- Única dependencia externa: la tipografía (Barlow y Barlow Condensed). Si no carga, se usa la del sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-energia="0">
  <a class="saltar" href="#juego">Saltar a la pantalla principal</a>

  <div class="cabina">

    <!-- ============ VISTA EXTERIOR A TRAVÉS DEL PARABRISAS (decorativa) ============ -->
    <div class="exterior" aria-hidden="true">
      <div class="espacio"></div>
      <div class="tierra"></div>
      <div class="estelas"></div>
      <div class="reflejos"></div>
      <!-- Grieta del parabrisas: desaparece cuando la nave recupera energía -->
      <svg class="grieta" viewBox="0 0 400 260" preserveAspectRatio="xMinYMin meet">
        <g fill="none" stroke="rgba(220,235,255,.55)" stroke-width="1.2" stroke-linecap="round">
          <path d="M120 90 L60 40 L20 30 M120 90 L40 110 L0 118 M120 90 L150 30 L170 0 M120 90 L210 120 L300 128 M120 90 L130 170 L110 240"/>
          <path d="M60 40 L48 70 M40 110 L62 140 M150 30 L190 46 M210 120 L222 92 M130 170 L160 196" stroke-width=".8"/>
          <circle cx="120" cy="90" r="6" stroke-width="1.6"/>
        </g>
      </svg>
      <!-- HUD proyectado en el cristal -->
      <svg class="hud" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet">
        <g fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M470 130 H488 M512 130 H530 M500 100 V118 M500 142 V160"/>
          <circle cx="500" cy="130" r="5"/>
          <path d="M380 92 H420 M580 92 H620 M380 168 H420 M580 168 H620"/>
        </g>
        <g fill="currentColor" font-family="Barlow Condensed, sans-serif" font-size="15" letter-spacing="1.5">
          <text x="380" y="80">ALT 412 KM</text>
          <text x="620" y="80" text-anchor="end" id="hud-estado">REACTOR · 3 %</text>
        </g>
      </svg>
    </div>

    <!-- Estructura de la cúpula: travesaño superior, montantes y marco -->
    <svg class="cupula" viewBox="0 0 1600 600" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="cupula-metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b2230"/>
          <stop offset="1" stop-color="#070a10"/>
        </linearGradient>
        <linearGradient id="cupula-montante" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#05070b"/>
          <stop offset=".6" stop-color="#1a2130"/>
          <stop offset="1" stop-color="#0b0f17"/>
        </linearGradient>
      </defs>
      <path d="M0 0 H1600 V64 C1180 40 420 40 0 64 Z" fill="url(#cupula-metal)"/>
      <path d="M0 0 H190 L64 600 H0 Z" fill="url(#cupula-montante)"/>
      <path d="M1600 0 H1410 L1536 600 H1600 Z" fill="url(#cupula-montante)"/>
      <path d="M190 0 L64 600 M1410 0 L1536 600" stroke="#2c3546" stroke-width="2.5"/>
      <path d="M0 64 C420 40 1180 40 1600 64" fill="none" stroke="#2c3546" stroke-width="2.5"/>
      <g class="pilotos-techo"><rect x="740" y="16" width="26" height="8" rx="2"/><rect x="787" y="16" width="26" height="8" rx="2"/><rect x="834" y="16" width="26" height="8" rx="2"/></g>
    </svg>

    <!-- Luz ambiental de la cabina: roja en emergencia, azul al recuperar energía -->
    <div class="luz-ambiente" aria-hidden="true"></div>

    <!-- ============================ CONSOLA ============================ -->
    <div class="consola">

      <aside class="monitor monitor-sistemas" aria-label="Panel de sistemas">
        <p class="placa" aria-hidden="true">SYS · Estado de la nave</p>
        <div class="vidrio vidrio-sistemas">
          <h2 class="sistemas-titulo">Módulos</h2>
          <ol class="modulos" id="modulos"></ol>

          <div class="reactor-bloque">
            <p class="sistemas-etiqueta" id="reactor-etiqueta">Reactor de verdad</p>
            <div class="reactor" id="reactor" role="progressbar" aria-labelledby="reactor-etiqueta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span class="reactor-celda"></span><span class="reactor-celda"></span><span class="reactor-celda"></span><span class="reactor-celda"></span>
            </div>
            <p class="reactor-lectura" id="reactor-lectura">0 %</p>
          </div>

          <div class="codigo-bloque">
            <p class="sistemas-etiqueta">Código de activación</p>
            <p class="codigo" id="codigo"></p>
          </div>

          <p class="temporizador" id="temporizador" hidden></p>
        </div>
      </aside>

      <section class="monitor monitor-principal" aria-label="Pantalla principal">
        <p class="placa" aria-hidden="true">NAV · Pantalla principal</p>
        <main id="juego" class="vidrio vidrio-principal" tabindex="-1">
          <noscript><p class="aviso-carga">Para jugar necesitas activar JavaScript en tu navegador.</p></noscript>
        </main>
      </section>

      <section class="monitor monitor-com" aria-label="Canal de comunicación">
        <p class="placa" aria-hidden="true">COM · Canal de comunicación</p>
        <div class="vidrio vidrio-com">
          <div id="holograma" class="holograma"></div>
          <p id="mensaje" class="mensaje" aria-live="polite"></p>
          <!-- Ajustes: sonido, volumen, tamaño del texto y reinicio -->
          <div class="mandos" role="group" aria-label="Ajustes">
            <button type="button" class="mando" id="boton-sonido" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icono-altavoz" d="M4 9h4l5-4v14l-5-4H4z"/><path class="icono-ondas" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="icono-silencio" d="M16 9l5 6M21 9l-5 6"/></svg>
              <span id="boton-sonido-texto">Activar sonido</span>
            </button>
            <label class="volumen" for="volumen">
              <span>Volumen</span>
              <input type="range" id="volumen" min="0" max="100" step="5" value="50">
            </label>
            <button type="button" class="mando" id="boton-texto" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18 8 6l5 12M5 14h6M15 18l3.5-8 3.5 8M16.2 15.5h4.6"/></svg>
              <span>Ampliar texto</span>
            </button>
            <button type="button" class="mando" id="boton-reiniciar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
              <span>Reiniciar</span>
            </button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- Avisos para lectores de pantalla -->
  <div id="anuncio" class="solo-lector" aria-live="polite"></div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
